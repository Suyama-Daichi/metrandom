<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a4a"/>
      <stop offset="1" stop-color="#0f1626"/>
    </linearGradient>
  </defs>
  <!-- rounded background -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- subway car -->
  <g>
    <!-- body -->
    <rect x="8" y="6" width="16" height="17" rx="5" fill="#ffd84d"/>
    <!-- windshield band -->
    <rect x="9.5" y="9" width="13" height="6" rx="2.5" fill="#0f1626"/>
    <!-- windows split -->
    <rect x="15" y="9" width="1.6" height="6" fill="#ffd84d"/>
    <!-- headlights -->
    <circle cx="12" cy="18" r="1.5" fill="#ffffff"/>
    <circle cx="20" cy="18" r="1.5" fill="#ffffff"/>
    <!-- coupler / nose accent -->
    <rect x="13.5" y="20.5" width="5" height="2" rx="1" fill="#0f1626"/>
  </g>
  <!-- track -->
  <rect x="6" y="25.5" width="20" height="1.6" rx="0.8" fill="#9aa6c4"/>
  <rect x="10" y="27.5" width="2.2" height="2.2" rx="0.6" fill="#9aa6c4"/>
  <rect x="19.8" y="27.5" width="2.2" height="2.2" rx="0.6" fill="#9aa6c4"/>
</svg>
