name = "metrandom-spots"
main = "src/index.js"
compatibility_date = "2025-06-17"

# --- 公開方法（同一オリジン /api/spots）-------------------------------------
# 独自ドメイン metrandom.com を Cloudflare 管理にしている前提で、同一オリジンの
# /api/spots に割り当てます（CORS不要・実装隠蔽）。フロントの SPOTS_API は
# 既定の '/api/spots' のままで動作します。
#
# ドメインがまだ Cloudflare 管理でない場合は、この routes をコメントアウトすると
# https://metrandom-spots.<your-subdomain>.workers.dev で公開でき、その URL を
# フロントの SPOTS_API（…/spots）に設定すれば動きます（CORSは許可済み）。
routes = [
  { pattern = "metrandom.com/api/spots", zone_name = "metrandom.com" }
]
